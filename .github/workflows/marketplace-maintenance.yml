name: Marketplace Maintenance
on:
  push:
    branches: [main]
    paths: ['run.ps1', 'scripts/launcher-process.ps1', 'scripts/marketplace_state.py', 'scripts/test_marketplace_state.py', 'scripts/generate_marketplace.py', '.github/workflows/marketplace-maintenance.yml']
  pull_request:
    paths: ['run.ps1', 'scripts/launcher-process.ps1', 'scripts/marketplace_state.py', 'scripts/test_marketplace_state.py', 'scripts/generate_marketplace.py', '.github/workflows/marketplace-maintenance.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Offline regression checks
        run: python -B -m unittest discover -s scripts -p test_marketplace_state.py
      - name: Parse launcher and process helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @('run.ps1', 'scripts/launcher-process.ps1')) {
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors -join "`n") }
          }
